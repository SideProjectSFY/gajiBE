plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.gaji'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// The repository is in a phase-1 directory split: executable apps own the
// compiled source set, while root/domain/shared projects are structural holders.
tasks.matching { task ->
    task.name in [
        'compileJava',
        'processResources',
        'classes',
        'jar',
        'assemble',
        'compileTestJava',
        'processTestResources',
        'testClasses',
        'test',
        'check',
        'build'
    ]
}.configureEach {
    enabled = false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    sourceCompatibility = '21'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
        annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
        annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
        annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.junit.jupiter:junit-jupiter-api'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    }

    test {
        useJUnitPlatform()
    }
}

configure(subprojects.findAll { subproject ->
    subproject.path == ':shared-kernel' ||
        subproject.path == ':apps:batch-app' ||
        subproject.path.startsWith(':domains:')
}) {
    tasks.matching { task ->
        task.name in [
            'compileJava',
            'processResources',
            'classes',
            'jar',
            'bootJar',
            'assemble',
            'compileTestJava',
            'processTestResources',
            'testClasses',
            'test',
            'check',
            'build'
        ]
    }.configureEach {
        enabled = false
    }
}
