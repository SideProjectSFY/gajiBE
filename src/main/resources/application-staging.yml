# Staging Environment Configuration
spring:
  # Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  # Database Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${DB_HIKARI_POOL_NAME:GajiApiHikariPool}
      maximum-pool-size: ${DB_HIKARI_MAXIMUM_POOL_SIZE:15}
      minimum-idle: ${DB_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_HIKARI_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_HIKARI_LEAK_DETECTION_THRESHOLD_MS:60000}

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true # Prevent accidental clean

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  # Security
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 86400000 # 24 hours

# FastAPI Proxy Configuration
fastapi:
  base-url: ${FASTAPI_BASE_URL:http://fastapi:8000}
  timeout: 60
  retry:
    max-attempts: 3

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.gaji.me}

# Logging Configuration
logging:
  level:
    root: INFO
    com.gaji.corebackend: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.mybatis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId:-}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/gaji-backend/application.log
    max-size: 10MB
    max-history: 30

# Actuator Configuration
management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Swagger Configuration
springdoc:
  swagger-ui:
    enabled: true
