# Gaji Backend - Main Configuration
# Profile-specific configurations are in application-{profile}.yml

spring:
  application:
    name: gaji-backend

  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Default Security Configuration (overridden by profiles)
  security:
    jwt:
      secret: ${JWT_SECRET:default-secret-key-minimum-32-chars-required-for-hs256}
      expiration: ${JWT_EXPIRATION:86400000} # 24 hours

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Actuator Configuration
management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.gaji.corebackend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true

# CORS Configuration (default values)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://gaji.app}

gaji:
  ai:
    provider:
      timeout-ms: ${AI_PROVIDER_TIMEOUT_MS:30000}
      gemini:
        api-key: ${GEMINI_API_KEY:}
        api-keys: ${GEMINI_API_KEYS:}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    rag:
      timeout-ms: ${RAG_TIMEOUT_MS:5000}
      pgvector:
        enabled: ${RAG_PGVECTOR_ENABLED:true}
        table-name: ${RAG_PGVECTOR_TABLE_NAME:rag_passages}
      elasticsearch:
        enabled: ${RAG_ELASTICSEARCH_ENABLED:true}
        url: ${ELASTICSEARCH_URL:http://localhost:9200}
        index: ${RAG_ELASTICSEARCH_INDEX:gaji_novel_passages_v1}
    chat:
      max-concurrent-generations: ${AI_CHAT_MAX_CONCURRENT_GENERATIONS:10}
      acquire-timeout-ms: ${AI_CHAT_ACQUIRE_TIMEOUT_MS:500}
      recent-history-message-limit: ${AI_CHAT_RECENT_HISTORY_MESSAGE_LIMIT:7}
      max-output-tokens: ${AI_CHAT_MAX_OUTPUT_TOKENS:768}
  search:
    elasticsearch:
      enabled: ${CONVERSATION_SEARCH_ELASTICSEARCH_ENABLED:false}
      url: ${ELASTICSEARCH_URL:http://localhost:9200}
      conversation-message-index: ${CONVERSATION_SEARCH_ELASTICSEARCH_INDEX:gaji_conversation_messages_v1}
      timeout-ms: ${CONVERSATION_SEARCH_ELASTICSEARCH_TIMEOUT_MS:1500}
      retry-queue-max-size: ${CONVERSATION_SEARCH_ELASTICSEARCH_RETRY_QUEUE_MAX_SIZE:1000}
