pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            url 'https://repo.spring.io/release'
        }
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.springframework.boot') {
                useModule("org.springframework.boot:spring-boot-gradle-plugin:${requested.version}")
            }
        }
    }
}

rootProject.name = 'gaji-backend'

// Multi-module draft (DDD + modular monolith)
include(
    'apps:api-app',
    'apps:batch-app',
    'apps:admin-app',
    'domains:auth-domain',
    'domains:content-domain',
    'domains:scenario-domain',
    'domains:chat-domain',
    'domains:social-domain',
    'domains:search-domain',
    'domains:ai-domain',
    'shared-kernel'
)
